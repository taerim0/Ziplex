# Publishes ziplex to PyPI via Trusted Publishing (OIDC) -- no stored PyPI
# token anywhere. Triggered by pushing a version tag (e.g. `git tag v0.1.0 &&
# git push --tags`). Bump src/ziplex/__init__.py's __version__ (the single
# source pyproject.toml reads via [tool.setuptools.dynamic]), commit, then
# tag with a matching `vX.Y.Z` -- the "Verify tag matches package version"
# step below fails the build (before anything is uploaded to PyPI) if the
# two ever drift, instead of silently publishing a mismatched combination
# that PyPI can never let you overwrite or take back.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/ziplex/__init__.py').read()).group(1))")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/ziplex/__init__.py's __version__ ($PKG_VERSION)"
            exit 1
          fi

      - run: pip install build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the "Environment name" field exactly when registering the
    # pending publisher on PyPI (Account settings -> Publishing). Using a
    # named environment also lets required-reviewer protection be added
    # later in GitHub's own repo settings without touching this file.
    environment: pypi
    permissions:
      id-token: write  # the OIDC token trusted publishing signs with
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
