<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Ziplex</title>
<link rel="icon" href="assets/icon.ico">
<link rel="stylesheet" href="style.css">
<script>
  // Sets data-theme before first paint, so a light-theme choice doesn't
  // flash dark-then-light on load -- theme.js's own applyTheme() equivalent
  // runs too late for that (a type="module" script is deferred past first
  // paint by spec), so this is a plain, synchronous, non-module duplicate
  // of theme.js's getTheme() logic in miniature. Keep this key in sync with
  // theme.js's own THEME_KEY if it ever changes -- it deliberately isn't
  // imported from there so this can stay a zero-dependency inline script.
  (function () {
    var saved = localStorage.getItem("ziplex.theme");
    document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
  })();
</script>
</head>
<body>
<header id="topbar" class="topbar">
  <a href="#/" class="topbar-brand" data-topbar="home"><img src="assets/logo.png" alt="" class="brand-mark">Ziplex</a>
  <span id="app-version" class="topbar-version"></span>
  <a href="#/pack" data-topbar="pack" data-i18n="nav.pack">📦 프로젝트 패킹</a>
  <a href="#/check" data-topbar="check" data-i18n="nav.check">📂 프로젝트 확인</a>
  <a href="#/options" data-topbar="options" data-i18n="nav.options">⚙️ 옵션</a>
</header>
<div class="shell">
<nav id="nav" class="sidebar hidden">
  <a href="#/overview" data-route="overview" data-i18n="nav.overview">📊 Overview</a>
  <a href="#/files" data-route="files" data-i18n="nav.files">📄 Files</a>
  <a href="#/relationships" data-route="relationships" data-i18n="nav.relationships">🔗 Relationships</a>
  <a href="#/search" data-route="search" data-i18n="nav.search">🔍 Search</a>
  <button id="stale-badge" type="button" class="stale-badge hidden" aria-expanded="false" aria-controls="stale-detail-panel" data-i18n="core.stale.badge">⚠️ 변경됨</button>
  <div id="stale-detail-panel" class="stale-detail hidden"></div>
  <a href="#/check" class="change-project" data-i18n="nav.changeProject">📂 프로젝트 변경</a>
</nav>
<main id="app"></main>
</div>
<script type="module" src="js/router.js"></script>
</body>
</html>
