[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziplex"
dynamic = ["version"]
description = "Which tests does this change affect? A zero-config, incremental dependency graph (Python/TS/JS/Go) for CI test selection, editor hooks and coding agents (MCP)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "rim" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries",
    "Environment :: Console",
]
dependencies = [
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-java",
    "tree-sitter-typescript",
    "tree-sitter-lua",
    "tree-sitter-go",
    "tree-sitter-cpp",
    "tree-sitter-rust",
    "tree-sitter-c-sharp",
    "tree-sitter-php",
    "tree-sitter-ruby",
    "tree-sitter-bash",
    "tree-sitter-mlua",
    "tree-sitter-language-pack",
    "pathspec",
    "mcp",
    "ruamel.yaml",
    # tomllib is stdlib-only on 3.11+; tech_stack.py falls back to this
    # pure-Python backport (same API) on 3.10, where TOML manifest parsing
    # (pyproject.toml/Cargo.toml) would otherwise silently degrade to an
    # empty dependency list. See that module's own docstring.
    "tomli; python_version < \"3.11\"",
]

# The graph (index/deps/impact/path, MCP, hook) needs only the core
# dependencies above. LLM summaries and the GUI are opt-in.
[project.optional-dependencies]
llm = ["requests", "python-dotenv", "tiktoken"]
gui = ["flask", "pywebview", "watchdog"]
all = ["ziplex[llm,gui]"]
dev = ["pytest", "ziplex[all]"]

[project.urls]
Homepage = "https://github.com/taerim0/Ziplex"
Repository = "https://github.com/taerim0/Ziplex"

# `ziplex` covers pack/collect/tokens/tree/search/detail/freshness/skill/init
# (cli.py's own subcommands -- see the root AGENTS.md's Commands section);
# ziplex-gui and ziplex-mcp are separate entry points, not `ziplex`
# subcommands, since each starts its own long-running process (a local
# server, a stdio MCP loop) instead of running once and exiting.
[project.scripts]
ziplex = "ziplex.cli:main"
ziplex-mcp = "ziplex.mcp_server:main"
ziplex-hook = "ziplex.hook:main"

# ziplex-gui lives in gui-scripts, not scripts, on purpose -- on Windows
# this is the one distinction between a "console" and "GUI" launcher .exe
# (Unix ignores it; both groups produce an identical plain wrapper there).
# A console-subsystem exe always allocates its own console window, which
# for a native pywebview app shows up as a second, wrongly-iconed taskbar
# entry right next to the real one -- see gui_server.py's own module
# docstring for the full story, including why --no-window's log/URL output
# is unaffected.
[project.gui-scripts]
ziplex-gui = "ziplex.gui:main"

[tool.setuptools.dynamic]
version = { attr = "ziplex.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The GUI's frontend (index.html/js/**/style.css) ships as package data --
# gui_server.py's Flask app serves these straight off disk next to itself
# (static_folder="."), so they need to actually be installed alongside the
# .py files, not left behind as source-only assets. CLAUDE.md/AGENTS.md files
# are AI coding agents' own working notes for this repo, not runtime assets --
# deliberately excluded from the built package.
[tool.setuptools.package-data]
"ziplex.gui" = ["index.html", "style.css", "js/*.js", "js/pages/*.js", "assets/*.ico", "assets/*.png"]
